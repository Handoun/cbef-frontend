name: Build Desktop Apps

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: |
          node -e "
          const fs = require('fs');
          if (!fs.existsSync('electron')) fs.mkdirSync('electron');
          fs.writeFileSync('electron/package.json', JSON.stringify({main:'main.js',scripts:{start:'electron .',dist:'electron-builder'},build:{appId:'com.cbef.desktop',productName:'CBEF',directories:{output:'release'},win:{target:'nsis'},mac:{target:'dmg'},linux:{target:'AppImage'}},devDependencies:{electron:'^26.2.2','electron-builder':'^24.6.0'}}));
          fs.writeFileSync('electron/main.js', \"const { app, BrowserWindow } = require('electron'); function createWindow() { const win = new BrowserWindow({ width: 1200, height: 800, webPreferences: { nodeIntegration: true, contextIsolation: false } }); win.loadURL('https://87.120.165.116.nip.io'); } app.whenReady().then(createWindow);\");
          "
      - run: cd electron && npm install
      - run: cd electron && npm run dist -- --win
      - uses: actions/upload-artifact@v4
        with:
          name: CBEF-Windows
          path: electron/release/*.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: |
          node -e "
          const fs = require('fs');
          if (!fs.existsSync('electron')) fs.mkdirSync('electron');
          fs.writeFileSync('electron/package.json', JSON.stringify({main:'main.js',scripts:{start:'electron .',dist:'electron-builder'},build:{appId:'com.cbef.desktop',productName:'CBEF',directories:{output:'release'},win:{target:'nsis'},mac:{target:'dmg'},linux:{target:'AppImage'}},devDependencies:{electron:'^26.2.2','electron-builder':'^24.6.0'}}));
          fs.writeFileSync('electron/main.js', \"const { app, BrowserWindow } = require('electron'); function createWindow() { const win = new BrowserWindow({ width: 1200, height: 800, webPreferences: { nodeIntegration: true, contextIsolation: false } }); win.loadURL('https://87.120.165.116.nip.io'); } app.whenReady().then(createWindow);\");
          "
      - run: cd electron && npm install
      - run: cd electron && npm run dist -- --mac
      - uses: actions/upload-artifact@v4
        with:
          name: CBEF-macOS
          path: electron/release/*.dmg

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: |
          node -e "
          const fs = require('fs');
          if (!fs.existsSync('electron')) fs.mkdirSync('electron');
          fs.writeFileSync('electron/package.json', JSON.stringify({main:'main.js',scripts:{start:'electron .',dist:'electron-builder'},build:{appId:'com.cbef.desktop',productName:'CBEF',directories:{output:'release'},win:{target:'nsis'},mac:{target:'dmg'},linux:{target:'AppImage'}},devDependencies:{electron:'^26.2.2','electron-builder':'^24.6.0'}}));
          fs.writeFileSync('electron/main.js', \"const { app, BrowserWindow } = require('electron'); function createWindow() { const win = new BrowserWindow({ width: 1200, height: 800, webPreferences: { nodeIntegration: true, contextIsolation: false } }); win.loadURL('https://87.120.165.116.nip.io'); } app.whenReady().then(createWindow);\");
          "
      - run: cd electron && npm install
      - run: cd electron && npm run dist -- --linux
      - uses: actions/upload-artifact@v4
        with:
          name: CBEF-Linux
          path: electron/release/*.AppImage